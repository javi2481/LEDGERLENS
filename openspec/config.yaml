# openspec/config.yaml
schema: spec-driven
project: ledgerlens
persistence: hybrid
strict_tdd: false

context: |
  Product: LedgerLens is a domain-general IDP (recipe → typed extract → claims → identity lookup). Finance (BYMA EEFF) is the first plugin, not the ceiling. Active OpenSpec change: ledgerlens-idp-kernel. Identity contract is evals/identity_v1.json + recipes/financial_statement.json; exact-match, no embeddings.
  Demo track (frozen, not product SoT): RAGFlow v0.26.4 + Infinity + MinerU pipeline sidecar + Groq llama-3.3-70b-versatile + Voyage. OpenSpec change ledger-lens-ragflow is the demo pin — do not inflate it with IDP work. Overlay Graph (docs/hechos_eeff.json + push_hechos.py) is demo-only gold; do not merge with identity evals.
  Runtime kernel: ./scripts/check.sh (pytest) on any host with pdftotext. Runtime demo: Docker Compose, x86_64, ≥16 GB. No Gradio, no Hugging Face Space, no custom Python RAG package, no app.py, no ledger_lens/.
  Persistence: hybrid (openspec files + Engram observations, project ledgerlens).
  Docs: product changes update README.md + ledgerlens-idp-kernel in the same work unit. Demo pin / Compose / .env.example stay on the demo track.
  Testing: ./scripts/check.sh runs file contracts + pytest capa 1-2. RAG E2E is manual on ≥16 GB and is not the IDP DoD. strict_tdd stays false.

testing:
  strict_tdd: false
  strict_tdd_reason: "scripts/check.sh runs contracts + pytest for IDP layers 1-2. RAGFlow E2E stays manual on ≥16 GB. Strict TDD stays disabled."
  runner:
    command: "./scripts/check.sh"
    framework: bash
  layers:
    unit: false
    integration: false
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter: ""
    type_checker: ""
    formatter: ""

rules:
  proposal:
    - Include rollback plan for risky changes
    - Do not propose Gradio, Hugging Face Spaces, ZeroGPU, or a custom Python RAG package
    - Keep the product as a portfolio demo with BYMA sample documents
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Answers MUST be in Spanish and MUST cite retrieved evidence
    - When evidence is missing, the system MUST return an empty/no-evidence reply instead of inventing
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Compose RAGFlow + Infinity + Groq chat + Voyage embed; MinerU pipeline default parser; Ollama last fallback; PaddleOCR optional; do not introduce app.py
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Use BYMA sample PDFs in docs/archivos_muestra/; do not invent filings
    tdd: false
    test_command: "./scripts/check.sh"
  verify:
    test_command: "./scripts/check.sh"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
