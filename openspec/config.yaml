# openspec/config.yaml
schema: spec-driven
project: ledgerlens
persistence: hybrid
strict_tdd: false

context: |
  Product: LedgerLens — Spanish Q&A over BYMA sample financial PDFs with citations; empty/no-evidence reply instead of inventing.
  Intended stack: RAGFlow v0.26.4 self-host (UI + RAG) + Infinity. Default PDF parser MinerU pipeline (sidecar MINERU_APISERVER=http://mineru-api:8000, MINERU_BACKEND=pipeline); Naive/DeepDoc fallback; optional PaddleOCR overlay. Default chat: Groq llama-3.3-70b-versatile in RAGFlow UI; host Ollama qwen2.5:1.5b last fallback (http://host.docker.internal:11434, never 127.0.0.1). No LiteLLM sidecar. OpenRouter Nano :free is not the default. Embed/rerank: Voyage native in RAGFlow.
  Runtime: Docker Compose local, x86_64, ≥16 GB. Host-level checks: ./scripts/check.sh. No Gradio, no Hugging Face Space, no custom Python RAG package, no app.py.
  Demo constraint: BYMA sample PDFs in docs/archivos_muestra/ (portfolio demo; not a live market product).
  Persistence: hybrid (openspec files + Engram observations, project ledgerlens).
  Docs: when a change modifies the product, README.md, docs/agenda/, research/README.md, .env.example comments, and the active OpenSpec change must be updated in the same work unit.
  Testing: scripts/check.sh exists; E2E is manual on ≥16 GB. strict_tdd stays false.

testing:
  strict_tdd: false
  strict_tdd_reason: "Host-level scripts/check.sh is not a Strict TDD runner. E2E is manual RAGFlow UI on ≥16 GB. Strict TDD stays disabled."
  runner:
    command: "./scripts/check.sh"
    framework: bash
  layers:
    unit: false
    integration: false
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter: ""
    type_checker: ""
    formatter: ""

rules:
  proposal:
    - Include rollback plan for risky changes
    - Do not propose Gradio, Hugging Face Spaces, ZeroGPU, or a custom Python RAG package
    - Keep the product as a portfolio demo with BYMA sample documents
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Answers MUST be in Spanish and MUST cite retrieved evidence
    - When evidence is missing, the system MUST return an empty/no-evidence reply instead of inventing
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Compose RAGFlow + Infinity + Groq chat + Voyage embed; MinerU pipeline default parser; Ollama last fallback; PaddleOCR optional; do not introduce app.py
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Use BYMA sample PDFs in docs/archivos_muestra/; do not invent filings
    tdd: false
    test_command: "./scripts/check.sh"
  verify:
    test_command: "./scripts/check.sh"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
