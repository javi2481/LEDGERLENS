<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Identity trap 1T26 — consolidado vs controlante</title>
  <desc id="d">Consolidated net income 21.262.335 is not the same as controlling interest 21.259.769 on BYMA 1T26 page 4.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0F1A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#6366F1" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
  </g>

  <!-- Header -->
  <text x="60" y="48" font-family="Inter, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="2">CLAIMPRINT · IDENTITY TRAP</text>
  <text x="60" y="82" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">The neighboring row is not net income</text>
  <text x="60" y="112" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748B">BYMA financial statements 1T26 · page 4 · unspecified → consolidated</text>

  <!-- Consolidado -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="520" height="360" rx="16" fill="#0D2818" stroke="#2DD4BF" stroke-width="2"/>
    <rect x="0" y="0" width="520" height="3" rx="16" fill="#2DD4BF"/>
    <text x="260" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2DD4BF" letter-spacing="1.5">CONSOLIDATED</text>
    <text x="260" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">NET INCOME FOR THE PERIOD</text>
    <text x="260" y="200" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="52" font-weight="800" fill="#F8FAFC" letter-spacing="-1">21.262.335</text>
    <text x="260" y="268" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#64748B">BYMA | 2026-03-31 | consolidado | resultado_neto</text>
    <text x="260" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2DD4BF">default answer</text>
  </g>

  <!-- Controlante -->
  <g transform="translate(620, 140)">
    <rect x="0" y="0" width="520" height="360" rx="16" fill="#131B2E" stroke="#FB923C" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="3" rx="16" fill="#FB923C"/>
    <text x="260" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FB923C" letter-spacing="1.5">CONTROLLING INTEREST</text>
    <text x="260" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#E2E8F0">attributable to shareholders</text>
    <text x="260" y="200" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="52" font-weight="800" fill="#F8FAFC" letter-spacing="-1">21.259.769</text>
    <text x="260" y="268" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#64748B">BYMA | 2026-03-31 | controlante | atribuible</text>
    <text x="260" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#FB923C">only when the question asks for it</text>
  </g>

  <!-- Footer -->
  <text x="60" y="548" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">Chunk RAG mixes both rows. Typed claims separate them.</text>
  <text x="60" y="578" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">Claimprint · evals/identity_v1.json · 1T26 trap · Finance / BYMA · academic portfolio project</text>
</svg>
