name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install IDP test deps
        run: pip install -r requirements-dev.txt
      - name: Contracts + pytest (no Docker, no LLM)
        run: bash scripts/check.sh
