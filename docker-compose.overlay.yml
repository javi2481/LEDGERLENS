# Optional PaddleOCR on the official RAGFlow network (profile: paddleocr).
# Default demo parser in the UI is Naive (synthetic PDFs are text). DeepDoc stays in-image for scans.
# Do not publish host :8080.
#
# Enable: COMPOSE_PROFILES=infinity,cpu,paddleocr
services:
  paddleocr:
    profiles:
      - paddleocr
    build:
      context: ./docker/paddleocr
      dockerfile: Dockerfile
    image: ledgerlens-paddleocr:cpu
    restart: unless-stopped
    networks:
      - ragflow
    shm_size: "2gb"
    environment:
      PADDLE_PDX_MODEL_SOURCE: huggingface

networks:
  ragflow:
    driver: bridge
