# MinerU pipeline CPU is the default PDF parser sidecar (RAGFlow POST /file_parse).
# Official mineru:latest is GPU/vLLM; this overlay builds docker/mineru (CPU).
# PaddleOCR stays optional (profile: paddleocr). DeepDoc stays in-image for scans.
# Do not publish host :8080.
#
# Build contexts are relative to vendor/ragflow-docker (first -f / Compose bake).
# From that dir, repo docker/ is ../../docker/.
# Enable PaddleOCR: COMPOSE_PROFILES=infinity,cpu,paddleocr
services:
  mineru-api:
    build:
      context: ../../docker/mineru
      dockerfile: Dockerfile
    image: claimprint-mineru:cpu
    restart: unless-stopped
    networks:
      - ragflow
    ports:
      - "8000:8000"
    environment:
      MINERU_MODEL_SOURCE: huggingface
    volumes:
      - mineru-cache:/root/.cache
    shm_size: "2gb"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  ragflow-cpu:
    depends_on:
      mysql:
        condition: service_healthy
      mineru-api:
        condition: service_healthy

  paddleocr:
    profiles:
      - paddleocr
    build:
      context: ../../docker/paddleocr
      dockerfile: Dockerfile
    image: claimprint-paddleocr:cpu
    restart: unless-stopped
    networks:
      - ragflow
    shm_size: "2gb"
    environment:
      PADDLE_PDX_MODEL_SOURCE: huggingface

volumes:
  mineru-cache:

networks:
  ragflow:
    driver: bridge
