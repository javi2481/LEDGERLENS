# LedgerLens overlay: self-hosted PaddleOCR on the official RAGFlow network.
# Do not publish host :8080 — RAGFlow reaches the parser via Compose DNS.
services:
  paddleocr:
    build:
      context: ./docker/paddleocr
      dockerfile: Dockerfile
    image: ledgerlens-paddleocr:cpu
    restart: unless-stopped
    networks:
      - ragflow
    shm_size: "2gb"
    environment:
      PADDLE_PDX_MODEL_SOURCE: huggingface

  ragflow-cpu:
    depends_on:
      paddleocr:
        condition: service_started

networks:
  ragflow:
    driver: bridge
